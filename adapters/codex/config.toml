# Amnesiac Agents baseline for Codex. Copied to ~/.codex/config.toml only if you have none.
# If you already have one, merge these keys by hand (the installer will not touch it).

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
project_doc_max_bytes = 32768

[features]
code_mode = false

[sandbox_workspace_write]
network_access = false

# One loop by default. Subagents only for parallel disposable work or black box verification.
[agents]
max_threads = 4
max_depth = 1

